<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>Subscription Checkout | devChallenges.io</title>

    <!--You are welcome to delete these styles or modify them in your own stylesheet -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Be Vietnam Pro";
      }
      button,
      input {
        border: none;
      }
      .row {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }

      .column {
        display: flex;
        flex-direction: column;
        align-items: start;
        justify-content: space-between;
      }

      .color_1 {
        color: #4d5562;
      }

      section {
        height: 100vh;
        width: 100%;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        padding: 2em;
      }
      .left {
        width: 50%;
      }
      .left,
      .right {
        height: 100%;
        gap: 16px;
        display: flex;
        padding-right: 1em;
        flex-direction: column;
        align-items: start;
        justify-content: space-between;
      }
      .right {
        width: 35%;
        background-color: #f0f3f6;
        border-radius: 16px;
        padding: 3em;
        overflow: hidden;
      }
      .form_left {
        display: flex;
        flex-direction: column;
        gap: 0.8em;
        width: 100%;
      }
      input[type="text"],
      select {
        height: 3em;
        border: 1px solid #4d5562;
        padding: 6px;
        width: 100%;
        font-size: 0.9em;
        border-radius: 6px;
      }
      input[type="radio"] {
        accent-color: #5425af;
      }

      .radio_label {
        width: 30%;
        height: 4.5em;
        display: flex;
        flex-direction: column;
        gap: 0.5em;
        padding: 0.5em;
        align-items: start;
        justify-content: center;
        border: 2px solid #4d5562;
        border-radius: 8px;
        p {
          font-size: 1em;
        }
      }
      .radio_group input:checked + .radio_label {
        background: #ece9fc;
        color: #000;
        border-color: #5425af;
      }
      .radio_group input {
        display: none;
      }
      .cnl_btn {
        height: 3em;
        background-color: #f0f3f6;
        padding: 6px;
        width: 30%;
        font-weight: 600;
        font-size: 0.8em;
        border-radius: 6px;
      }
      .sbc_btn {
        height: 3em;
        background-color: #5425af;
        color: #ffffff;
        padding: 6px;
        width: 65%;
        font-weight: 600;
        font-size: 0.8em;
        border-radius: 6px;
      }

      .form_right {
        display: flex;
        flex-direction: column;
        width: 100%;
        gap: 0.5em;
      }
      .form_right_box {
        display: flex;
        height: 4em;
        background-color: #ffffff;
        flex-direction: row;
        align-items: center;
        justify-content: start;
        border-radius: 12px;
        gap: 2em;
        padding-left: 1em;
      }
      .form_right_box label {
        display: flex;
        flex-direction: column;
        gap: 0.5em;
      }

      .form_right_box:has(input:checked) {
        background: #ece9fc;
        border: 2px solid #5425af;
      }
    </style>
  </head>
  <body>
    <!-- 
      Upgrade to Plus
  
      Upgrade today and take your AI-powered productivity to the next level.
  
      Billed to
  
      Enter first & last name
  
      Payment Details
  
      Credit Card
  
      Bank Transfer
  
      Points
  
      Email Address
  
      Enter email address
  
      Country
  
      Finland
  
      Postal Code
  
      00270
  
      Cancel
  
      Subscribe
  
      Starter Plan
  
      Pay monthly
  
      $20/ Month/ Member
  
      Pay Annual
  
      $16/ Month/ Member
  
      Total
  
      $20 / Month
  
      This environment is for demonstration purposes only. Please refrain from entering any actual sensitive data.
     -->

    <main>
      <section>
        <div class="left">
          <img src="./resources/neuralite-logo.svg" alt="company logo" />
          <h3>UPGRADE TO PLUS</h3>
          <p class="color_1">
            Upgrade today and take your AI-powered productivity to the next
            level.
          </p>
          <form class="form_left" method="post">
            <div class="column" style="gap: 0.5em">
              <label for="fname" class="color_1">Billed to</label>
              <input
                type="text"
                name="fname"
                placeholder="Enter first & last name"
              />
            </div>

            <p class="color_1">Payment details</p>
            <div class="row radio_group">
              <input class="radio_1" type="radio" name="details" id="Card" />
              <label class="radio_label" for="Card"
                ><i class="ri-bank-card-fill"></i>
                <p>Card</p></label
              >

              <input class="radio_1" type="radio" name="details" id="Bank" />
              <label class="radio_label" for="Bank"
                ><i class="ri-bank-line"></i>
                <p>Bank</p></label
              >

              <input class="radio_1" type="radio" name="details" id="Points" />
              <label class="radio_label" for="Points"
                ><i class="ri-eth-fill"></i>
                <p>Points</p></label
              >
            </div>
            <div class="column" style="gap: 0.5em">
              <label class="color_1" for="femail">Email Address</label>
              <input
                type="text"
                name="femail"
                placeholder="Enter email address"
              />
            </div>

            <div class="row">
              <div class="column" style="gap: 0.5em; width: 40%">
                <label class="color_1" for="fpostal">Postal Code</label>
                <select name="Country" id="">
                  <option value="Haiti">Haiti</option>
                  <option value="Finland">Finland</option>
                  <option value="USA">USA</option>
                </select>
              </div>

              <div class="column" style="gap: 0.5em; width: 40%">
                <label class="color_1" for="fpostal">Postal Code</label>
                <input type="text" name="fpostal" placeholder="00270" />
              </div>
            </div>
            <div class="row">
              <button class="cnl_btn">Cancel</button>
              <button class="sbc_btn">Subscribe</button>
            </div>
          </form>
        </div>
        <div class="right">
          <h3>Starter Plan</h3>

          <form class="form_right" method="post">
            <div class="form_right_box">
              <input type="radio" name="Plan" id="plan1" />
              <label for="plan1"
                ><p>pay Month</p>
                <span style="color: #4d5562">$20/Month/Member</span></label
              >
            </div>
            <div class="form_right_box">
              <input type="radio" name="Plan" id="plan2" />
              <label for="plan2"
                ><p>pay Month</p>
                <span style="color: #4d5562">$16/Month/Member</span></label
              >
            </div>
          </form>

          <hr style="width: 100%" />

          <div class="row" style="justify-content: space-between; width: 100%">
            <h3>Total</h3>
            <h3>$20/Month</h3>
          </div>
          <p style="color: #4d5562; font-size: 0.5em">
            <i class="ri-lock-unlock-line"></i> This environment is for
            demonstration purposes only. Please refrain from entering any actual
            sensitive data.
          </p>
          <img
            src="./resources/Checkout-background.png"
            height="220px"
            width="auto"
            alt=""
          />
        </div>
      </section>
    </main>
  </body>
</html>
